<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新鲜玛特的疯狂宇宙</title>
    <style>
        body { font-family: "Microsoft YaHei", "Arial Black", sans-serif; line-height: 1.5; background: #fff8dc; color: #222; max-width: 1100px; margin: 0 auto; padding: 20px; border: 6px solid #8b0000; }
        h1 { text-align: center; background: #8b0000; color: #fff; padding: 15px; letter-spacing: 2px; transform: rotate(-1deg); box-shadow: 5px 5px 0px #222; }
        .subtitle { text-align: center; font-weight: bold; color: #444; transform: rotate(1deg); margin-bottom: 30px; }
        .season-divider { background: #222; color: #fff; padding: 15px; font-size: 1.3rem; font-weight: 900; text-align: center; letter-spacing: 1px; margin: 40px 0 20px 0; border: 3px dashed #8b0000; transform: rotate(-1deg); box-shadow: -4px 4px 0px #8b0000; cursor: pointer; transition: all 0.2s; user-select: none; }
        .season-divider:hover { background: #444; color: #ffcccc; }
        .season-divider:nth-of-type(even) { transform: rotate(1deg); box-shadow: 4px 4px 0px #8b0000; }
        .container { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; transition: all 0.3s ease; }
        .ep { position: relative; background: #fff; padding: 15px; border: 2px dashed #444; box-shadow: 4px 4px 0px #aaa; transition: all 0.1s; cursor: pointer; }
        .ep:hover { background: #ffe4e1; box-shadow: 6px 6px 0px #8b0000; z-index: 10; transform: scale(1.02) !important; }
        .ep:nth-child(even) { transform: rotate(1.5deg); }
        .ep:nth-child(odd) { transform: rotate(-1.5deg); }
        .ep:nth-child(3n) { transform: rotate(0.5deg); }
        .score { position: absolute; top: 10px; right: 10px; background: #222; color: #ffcccc; font-size: 0.8rem; font-weight: 900; padding: 3px 6px; border-radius: 3px; border: 1px solid #8b0000; transform: rotate(4deg); box-shadow: 2px 2px 0px #8b0000; z-index: 2; }
        .ep:hover .score { transform: rotate(-2deg) scale(1.1); background: #8b0000; color: #fff; transition: all 0.2s; }
        .title { font-weight: 900; color: #b22222; font-size: 1.1rem; margin-bottom: 8px; border-bottom: 2px solid #222; padding-bottom: 3px; padding-right: 45px; }
        p { margin: 0; font-size: 0.95rem; color: #111; text-align: justify; }
    </style>
</head>
<body>

    <h1>新鲜玛特的疯狂宇宙<br>第二卷</h1>
    <p class="subtitle">—— 欢迎光临！您的底线已过期 ——</p>

    <!-- 初始的示例分卷结构 -->
    <!-- 第1季 -->
    <div class="season-divider">第一季</div>
    <div class="container" style="display: grid;">
        <div class="ep"><div class="score">8.5</div><div class="title">第1章：[标题占位符]</div><p>[内容占位符]</p></div>
    </div>

    <!-- 极简增删与同步控件 (编辑模式下显示) -->
    <div id="simple-edit-controls" style="display: none; text-align: center; margin: 40px auto 120px auto;">
        <button id="simple-add-btn" style="background: #228b22; color: #fff; border: none; border-radius: 50%; width: 65px; height: 65px; font-size: 35px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); margin: 0 15px; cursor: pointer; line-height: 65px; padding: 0;">＋</button>
        <button id="sync-titles-btn" style="background: #1e90ff; color: #fff; border: none; border-radius: 50%; width: 65px; height: 65px; font-size: 28px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); margin: 0 15px; cursor: pointer; line-height: 65px; padding: 0;" title="自动抓取文件标题">🔄</button>
        <button id="simple-del-btn" style="background: #8b0000; color: #fff; border: none; border-radius: 50%; width: 65px; height: 65px; font-size: 28px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); margin: 0 15px; cursor: pointer; line-height: 65px; padding: 0;">🗑️</button>
    </div>

    <!-- 悬浮的同步提交按钮 -->
    <div id="github-save-btn" style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 300px; background: #222; color: #fff; padding: 15px; border-radius: 12px; font-weight: 900; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 0px #8b0000; transition: all 0.1s; text-align: center; border: 2px solid #8b0000; z-index: 10000;">
        🚀 同步提交到 GitHub
    </div>

    <!-- 全局交互与编辑引擎 -->
    <script id="core-engine" data-file-path="">
        // ⚠️ 请确保此处填入你的 GitHub 仓库信息
        const GITHUB_OWNER = 'FreshMart'; 
        const GITHUB_REPO = 'FreshMart.github.io'; 
        // ⚠️====================================

        const controls = document.getElementById('simple-edit-controls');
        const saveBtn = document.getElementById('github-save-btn');
        const engineScript = document.getElementById('core-engine');

        // ==========================================
        // 1. 基础解析与缓存机制
        // ==========================================
        function chnToNumber(chnStr) {
            if (/^\d+$/.test(chnStr)) return parseInt(chnStr, 10);
            const chnNumChar = { 零:0, 一:1, 二:2, 三:3, 四:4, 五:5, 六:6, 七:7, 八:8, 九:9 };
            let s = chnStr.replace(/零/g, '');
            let h = 0, t = 0, o = 0;
            if (s.includes('百')) {
                let parts = s.split('百');
                h = parts[0] === '' || parts[0] === '一' ? 1 : (chnNumChar[parts[0]] || parseInt(parts[0]) || 1);
                s = parts[1];
            }
            if (s.includes('十')) {
                let parts = s.split('十');
                t = parts[0] === '' ? 1 : (chnNumChar[parts[0]] || parseInt(parts[0]) || 1);
                s = parts[1];
            }
            if (s) {
                o = chnNumChar[s] || parseInt(s) || 0;
            }
            return h * 100 + t * 10 + o;
        }

        let directoryCache = null;
        let isFetchingDir = false;

        async function getDirectoryFiles() {
            if (directoryCache) return directoryCache;
            if (isFetchingDir) {
                while(isFetchingDir) { await new Promise(r => setTimeout(r, 100)); }
                return directoryCache;
            }
            isFetchingDir = true;
            try {
                let filePath = engineScript.getAttribute('data-file-path');
                if (!filePath && typeof FILE_PATH !== 'undefined') filePath = FILE_PATH;
                const dirPath = filePath ? filePath.substring(0, filePath.lastIndexOf('/')) : '';
                if (!dirPath) throw new Error("尚未绑定 GitHub 路径，请先保存一次！");

                const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${dirPath}`;
                let headers = {};
                const token = localStorage.getItem('github_pat');
                if (token) headers['Authorization'] = `Bearer ${token}`; 

                const res = await fetch(url, { headers });
                if (res.ok) {
                    const files = await res.json();
                    directoryCache = files.map(f => f.name);
                } else {
                    console.error("无法拉取目录文件", await res.text());
                    directoryCache = []; 
                }
            } catch (e) {
                console.error(e);
                directoryCache = [];
            }
            isFetchingDir = false;
            return directoryCache;
        }

        // ==========================================
        // 2. 界面交互与模式切换
        // ==========================================
        function bindCollapseEvent(dividers) {
            dividers.forEach(button => {
                if (button.dataset.collapseBound) return;
                button.dataset.collapseBound = "true";
                button.addEventListener('click', () => {
                    const content = button.nextElementSibling;
                    if (content.style.display === "none" || content.style.display === "") {
                        content.style.display = "grid";
                    } else {
                        content.style.display = "none";
                    }
                });
            });
        }
        bindCollapseEvent(document.querySelectorAll('.season-divider'));

        const getEditableElements = () => document.querySelectorAll('.title, .ep p, .score');

        function bindEditEffects(elements) {
            elements.forEach(el => {
                if(el.dataset.bound) return; 
                el.dataset.bound = "true";
                el.addEventListener('focus', () => {
                    el.style.backgroundColor = '#fffacd';
                    el.style.outline = '2px dashed #8b0000';
                    if (el.classList.contains('score')) el.style.color = '#8b0000';
                });
                el.addEventListener('blur', () => {
                    el.style.backgroundColor = '';
                    el.style.outline = '';
                    if (el.classList.contains('score')) el.style.color = '';
                });
            });
        }
        bindEditEffects(getEditableElements());

        function toggleEditMode() {
            const isEditing = controls.style.display === 'block';
            if (!isEditing) {
                controls.style.display = 'block';
                saveBtn.style.display = 'block';
                document.body.style.border = '6px solid #228b22'; 
                getEditableElements().forEach(el => el.setAttribute('contenteditable', 'true'));
            } else {
                controls.style.display = 'none';
                saveBtn.style.display = 'none';
                document.body.style.border = '6px solid #8b0000';
                getEditableElements().forEach(el => {
                    el.blur();
                    el.removeAttribute('contenteditable');
                });
            }
        }

        document.addEventListener('touchstart', (e) => { 
            if (e.touches.length === 2) { e.preventDefault(); toggleEditMode(); } 
        }, { passive: false });
        document.addEventListener('dblclick', (e) => { 
            if (e.altKey) { window.getSelection().removeAllRanges(); toggleEditMode(); } 
        });

        // 卡片点击跳转逻辑
        document.addEventListener('click', async (e) => {
            const isEditing = controls.style.display === 'block';
            if (isEditing || e.altKey) return; 

            const epCard = e.target.closest('.ep');
            if (epCard) {
                const titleEl = epCard.querySelector('.title');
                if (titleEl) {
                    const titleText = titleEl.innerText.trim();

                    if (titleText.includes('占位符')) {
                        alert('🚧 该章节暂未更新，敬请期待！');
                        return;
                    }

                    const match = titleText.match(/第(.+?)章/);
                    if (!match) return alert('无法从标题中解析出章节序号！');

                    const chnStr = match[1];
                    const chapterNum = chnToNumber(chnStr);
                    const paddedNum = String(chapterNum).padStart(3, '0'); 

                    const originalBg = epCard.style.backgroundColor;
                    epCard.style.backgroundColor = '#ffe4e1';
                    epCard.style.cursor = 'wait';

                    const files = await getDirectoryFiles();

                    epCard.style.backgroundColor = originalBg;
                    epCard.style.cursor = 'pointer';

                    if (files.length === 0) return alert('未能获取到目录文件列表，请检查网络。');

                    const targetPrefix = `Chapter_${paddedNum}__`;
                    const targetFile = files.find(f => f.startsWith(targetPrefix));

                    if (targetFile) {
                        window.location.href = targetFile;
                    } else {
                        alert(`🔍 找不到对应的章节文件\n（期望前缀: ${targetPrefix}）`);
                    }
                }
            }
        });

        function generateRandomScore() {
            return (Math.random() * (9.9 - 7.5) + 7.5).toFixed(1);
        }

        // ==========================================
        // 3. 极简增删与✨自动抓取标题核心逻辑✨
        // ==========================================
        
        // 自动提取子文件内容并更新目录
        document.getElementById('sync-titles-btn').addEventListener('click', async () => {
            let token = localStorage.getItem('github_pat');
            if (!token) {
                token = prompt('读取子文件需要 GitHub Token:');
                if (!token) return;
                localStorage.setItem('github_pat', token);
            }

            let filePath = engineScript.getAttribute('data-file-path');
            if (!filePath && typeof FILE_PATH !== 'undefined') filePath = FILE_PATH;
            const dirPath = filePath ? filePath.substring(0, filePath.lastIndexOf('/')) : '';
            if (!dirPath) return alert("请先【保存】一次主目录，建立路径绑定！");

            const btn = document.getElementById('sync-titles-btn');
            const originalText = btn.innerText;
            btn.innerText = '⏳...';
            btn.style.pointerEvents = 'none';

            try {
                // 1. 拿文件列表
                const files = await getDirectoryFiles();
                const chapterFiles = files.filter(f => f.startsWith('Chapter_') && f.endsWith('.html'));

                if (chapterFiles.length === 0) throw new Error("目录下没有找到 Chapter_ 开头的 HTML 文件。");

                // 2. 并发读取所有具体章节文件的源码内容
                const fetchPromises = chapterFiles.map(async (filename) => {
                    const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${dirPath}/${filename}`;
                    const res = await fetch(url, {
                        headers: { 
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/vnd.github.v3.raw' 
                        }
                    });
                    if (!res.ok) return null;
                    return { filename, html: await res.text() };
                });

                const results = await Promise.all(fetchPromises);
                let updatedCount = 0;

                // 3. 虚拟 DOM 解析并对比替换
                results.forEach(item => {
                    if (!item) return;
                    const match = item.filename.match(/Chapter_(\d+)/);
                    if (!match) return;
                    const chapterNum = parseInt(match[1], 10);

                    // 虚拟解析 HTML
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(item.html, 'text/html');

                    // 提取标题
                    const h1Text = doc.querySelector('h1')?.innerText || '';
                    const enTitle = h1Text.includes(':') ? h1Text.substring(h1Text.indexOf(':') + 1).trim() : h1Text;

                    const zhText = doc.querySelector('.zh-para')?.innerText || '';
                    const zhTitle = zhText.includes('：') ? zhText.substring(zhText.indexOf('：') + 1).trim() : zhText;

                    if (!enTitle && !zhTitle) return;

                    // 在主页里找到对应卡片
                    document.querySelectorAll('.ep').forEach(card => {
                        const titleEl = card.querySelector('.title');
                        if (!titleEl) return;
                        
                        const titleMatch = titleEl.innerText.match(/第(.+?)章/);
                        if (titleMatch) {
                            const cardNum = chnToNumber(titleMatch[1]);
                            if (cardNum === chapterNum) {
                                let newTitleStr = `第${chapterNum}章：${zhTitle || enTitle}`;
                                if (zhTitle && enTitle && zhTitle !== enTitle) {
                                    newTitleStr += ` (${enTitle})`;
                                }
                                
                                if (titleEl.innerText !== newTitleStr && !titleEl.innerText.includes(zhTitle)) {
                                    titleEl.innerText = newTitleStr;
                                    updatedCount++;
                                }
                            }
                        }
                    });
                });

                alert(`✅ 扫描完成！共自动填充/更新了 ${updatedCount} 个章节标题。\n点击确定后将自动提交覆盖至云端！`);
                
                // 4. 自动触发整体 GitHub 保存！
                if (updatedCount > 0) {
                    saveBtn.click();
                }

            } catch (e) {
                console.error(e);
                alert('抓取失败: ' + e.message);
            } finally {
                btn.innerText = originalText;
                btn.style.pointerEvents = 'auto';
            }
        });

        // 极简增加逻辑 
        document.getElementById('simple-add-btn').addEventListener('click', () => {
            const nextSeasonNum = document.querySelectorAll('.season-divider').length + 1;
            const sName = prompt('请输入你要添加的季名：', `第${nextSeasonNum}季`);
            if (!sName) return; 

            let maxChapter = 0;
            document.querySelectorAll('.title').forEach(el => {
                const match = el.innerText.match(/第(\d+)章/);
                if (match) {
                    const num = parseInt(match[1], 10);
                    if (num > maxChapter) maxChapter = num;
                }
            });

            const startChapter = maxChapter + 1;
            const endChapter = maxChapter + 20; 
            let epTemplate = '';

            for (let i = startChapter; i <= endChapter; i++) {
                epTemplate += `<div class="ep"><div class="score">${generateRandomScore()}</div><div class="title">第${i}章：[标题占位符]</div><p>[内容占位符]</p></div>`;
            }
            const newSeasonHtml = `<div class="season-divider">${sName} (${startChapter === endChapter ? `第${startChapter}章` : `第${startChapter}-${endChapter}章`})</div><div class="container" style="display: grid;">${epTemplate}</div>`;

            controls.insertAdjacentHTML('beforebegin', newSeasonHtml);
            const newContainer = controls.previousElementSibling;
            const newDivider = newContainer.previousElementSibling;

            bindCollapseEvent([newDivider]);

            const newEdits = newContainer.querySelectorAll('.title, .ep p, .score');
            bindEditEffects(newEdits);
            newEdits.forEach(el => el.setAttribute('contenteditable', 'true'));

            alert('✨ 章节已生成在页面底部！\n生成后，可以点击【🔄】自动去抓取替换占位符标题！');
        });

        // 删除逻辑
        document.getElementById('simple-del-btn').addEventListener('click', () => {
            const dividers = document.querySelectorAll('.season-divider');
            if (dividers.length === 0) return alert('已经删光了！');

            const lastDivider = dividers[dividers.length - 1];
            const lastContainer = lastDivider.nextElementSibling;

            if (confirm(`⚠️ 确定要删除【${lastDivider.innerText}】吗？`)) {
                lastDivider.remove();
                if (lastContainer && lastContainer.classList.contains('container')) lastContainer.remove();
            }
        });

        // ==========================================
        // 4. 白名单重建引擎与 GitHub 提交流程
        // ==========================================
        function getPurifiedHTML() {
            const seasonsData = [];
            document.querySelectorAll('.season-divider').forEach(divider => {
                const container = divider.nextElementSibling;
                const isVisible = container && container.style.display !== 'none';
                const epsData = [];
                if(container && container.classList.contains('container')) {
                    container.querySelectorAll('.ep').forEach(ep => {
                        const getSafeText = (selector) => {
                            const el = ep.querySelector(selector);
                            if (!el) return "";
                            const clone = el.cloneNode(true);
                            clone.querySelectorAll('.para-read-btn, .x-tts-header-btn, svg, img, button, a').forEach(n => n.remove());
                            let text = clone.innerText.trim();
                            return text.replace(/\n/g, '<br>');
                        };
                        epsData.push({ score: getSafeText('.score'), title: getSafeText('.title'), content: getSafeText('p') });
                    });
                }
                const divClone = divider.cloneNode(true);
                divClone.querySelectorAll('*').forEach(n => n.remove());
                seasonsData.push({ title: divClone.innerText.trim(), isVisible: isVisible, eps: epsData });
            });

            let htmlBlocks = [];
            htmlBlocks.push('<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>新鲜玛特的疯狂宇宙</title>\n    <style>');
            htmlBlocks.push('        body { font-family: "Microsoft YaHei", "Arial Black", sans-serif; line-height: 1.5; background: #fff8dc; color: #222; max-width: 1100px; margin: 0 auto; padding: 20px; border: 6px solid #8b0000; }');
            htmlBlocks.push('        h1 { text-align: center; background: #8b0000; color: #fff; padding: 15px; letter-spacing: 2px; transform: rotate(-1deg); box-shadow: 5px 5px 0px #222; }');
            htmlBlocks.push('        .subtitle { text-align: center; font-weight: bold; color: #444; transform: rotate(1deg); margin-bottom: 30px; }');
            htmlBlocks.push('        .season-divider { background: #222; color: #fff; padding: 15px; font-size: 1.3rem; font-weight: 900; text-align: center; letter-spacing: 1px; margin: 40px 0 20px 0; border: 3px dashed #8b0000; transform: rotate(-1deg); box-shadow: -4px 4px 0px #8b0000; cursor: pointer; transition: all 0.2s; user-select: none; }');
            htmlBlocks.push('        .season-divider:hover { background: #444; color: #ffcccc; }');
            htmlBlocks.push('        .season-divider:nth-of-type(even) { transform: rotate(1deg); box-shadow: 4px 4px 0px #8b0000; }');
            htmlBlocks.push('        .container { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; transition: all 0.3s ease; }');
            htmlBlocks.push('        .ep { position: relative; background: #fff; padding: 15px; border: 2px dashed #444; box-shadow: 4px 4px 0px #aaa; transition: all 0.1s; cursor: pointer; }');
            htmlBlocks.push('        .ep:hover { background: #ffe4e1; box-shadow: 6px 6px 0px #8b0000; z-index: 10; transform: scale(1.02) !important; }');
            htmlBlocks.push('        .ep:nth-child(even) { transform: rotate(1.5deg); }');
            htmlBlocks.push('        .ep:nth-child(odd) { transform: rotate(-1.5deg); }');
            htmlBlocks.push('        .ep:nth-child(3n) { transform: rotate(0.5deg); }');
            htmlBlocks.push('        .score { position: absolute; top: 10px; right: 10px; background: #222; color: #ffcccc; font-size: 0.8rem; font-weight: 900; padding: 3px 6px; border-radius: 3px; border: 1px solid #8b0000; transform: rotate(4deg); box-shadow: 2px 2px 0px #8b0000; z-index: 2; }');
            htmlBlocks.push('        .ep:hover .score { transform: rotate(-2deg) scale(1.1); background: #8b0000; color: #fff; transition: all 0.2s; }');
            htmlBlocks.push('        .title { font-weight: 900; color: #b22222; font-size: 1.1rem; margin-bottom: 8px; border-bottom: 2px solid #222; padding-bottom: 3px; padding-right: 45px; }');
            htmlBlocks.push('        p { margin: 0; font-size: 0.95rem; color: #111; text-align: justify; }');
            htmlBlocks.push('    </style>\n</head>\n<body>\n');
            htmlBlocks.push('    <h1>新鲜玛特的疯狂宇宙<br>第二卷</h1>');
            htmlBlocks.push('    <p class="subtitle">—— 欢迎光临！您的底线已过期 ——</p>\n');

            seasonsData.forEach((s, idx) => {
                htmlBlocks.push(`    <!-- 第${idx + 1}季 -->`);
                htmlBlocks.push(`    <div class="season-divider">${s.title}</div>`);
                htmlBlocks.push(`    <div class="container" style="display: ${s.isVisible ? 'grid' : 'none'};">`);
                s.eps.forEach(ep => {
                    htmlBlocks.push(`        <div class="ep"><div class="score">${ep.score}</div><div class="title">${ep.title}</div><p>${ep.content}</p></div>`);
                });
                htmlBlocks.push('    </div>\n');
            });

            htmlBlocks.push('    <!-- 极简增删与同步控件 (编辑模式下显示) -->');
            htmlBlocks.push('    <div id="simple-edit-controls" style="display: none; text-align: center; margin: 40px auto 120px auto;">');
            htmlBlocks.push('        <button id="simple-add-btn" style="background: #228b22; color: #fff; border: none; border-radius: 50%; width: 65px; height: 65px; font-size: 35px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); margin: 0 15px; cursor: pointer; line-height: 65px; padding: 0;">＋</button>');
            htmlBlocks.push('        <button id="sync-titles-btn" style="background: #1e90ff; color: #fff; border: none; border-radius: 50%; width: 65px; height: 65px; font-size: 28px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); margin: 0 15px; cursor: pointer; line-height: 65px; padding: 0;" title="自动抓取文件标题">🔄</button>');
            htmlBlocks.push('        <button id="simple-del-btn" style="background: #8b0000; color: #fff; border: none; border-radius: 50%; width: 65px; height: 65px; font-size: 28px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); margin: 0 15px; cursor: pointer; line-height: 65px; padding: 0;">🗑️</button>');
            htmlBlocks.push('    </div>\n');
            htmlBlocks.push('    <!-- 悬浮的同步提交按钮 -->');
            htmlBlocks.push('    <div id="github-save-btn" style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 300px; background: #222; color: #fff; padding: 15px; border-radius: 12px; font-weight: 900; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 0px #8b0000; transition: all 0.1s; text-align: center; border: 2px solid #8b0000; z-index: 10000;">');
            htmlBlocks.push('        🚀 同步提交到 GitHub\n    </div>\n');

            let currentSavedPath = engineScript.getAttribute('data-file-path');
            if (!currentSavedPath && typeof FILE_PATH !== 'undefined') currentSavedPath = FILE_PATH;

            const scriptContent = document.getElementById('core-engine').innerHTML;
            htmlBlocks.push('    <!-- 全局交互与编辑引擎 -->');
            htmlBlocks.push(`    <script id="core-engine" data-file-path="${currentSavedPath}">\n` + scriptContent + '\n    <' + '/script>');
            htmlBlocks.push('</body>\n</html>');

            return htmlBlocks.join('\n');
        }

        saveBtn.addEventListener('mousedown', () => { saveBtn.style.boxShadow = '0 0px 0px #8b0000'; saveBtn.style.transform = 'translateX(-50%) translateY(4px)'; });
        saveBtn.addEventListener('mouseup', () => { saveBtn.style.boxShadow = '0 4px 0px #8b0000'; saveBtn.style.transform = 'translateX(-50%) translateY(0)'; });
        saveBtn.addEventListener('touchstart', () => { saveBtn.style.boxShadow = '0 0px 0px #8b0000'; saveBtn.style.transform = 'translateX(-50%) translateY(4px)'; });
        saveBtn.addEventListener('touchend', () => { saveBtn.style.boxShadow = '0 4px 0px #8b0000'; saveBtn.style.transform = 'translateX(-50%) translateY(0)'; });

        saveBtn.addEventListener('click', async () => {
            let token = localStorage.getItem('github_pat');
            if (!token) {
                token = prompt('请输入 GitHub Token:');
                if (!token) return;
                localStorage.setItem('github_pat', token);
            }

            let filePath = engineScript.getAttribute('data-file-path');
            if (!filePath) {
                filePath = prompt('【初次绑定】请输入此故事要保存的专属 GitHub 路径\n(例如：Notes/danmu/MyNewStory/index.html):');
                if (!filePath) return;
                engineScript.setAttribute('data-file-path', filePath);
            }

            saveBtn.innerText = '⏳ 白名单重建并同步中...';
            saveBtn.style.pointerEvents = 'none';
            try {
                const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${filePath}`;
                let fileSha = undefined;
                try {
                    const getRes = await fetch(apiUrl, { headers: { 'Authorization': `Bearer ${token}` } });
                    if (getRes.status === 401) {
                        localStorage.removeItem('github_pat');
                        throw new Error('Token 无效，请重新输入。');
                    }
                    if (getRes.ok) {
                        fileSha = (await getRes.json()).sha;
                    }
                } catch (e) {
                    if(e.message.includes('Token')) throw e;
                }

                const cleanHTML = getPurifiedHTML(); 

                const bodyData = {
                    message: '📝 更新宇宙档案 (触发自动标题同步)',
                    content: btoa(unescape(encodeURIComponent(cleanHTML)))
                };
                if (fileSha) bodyData.sha = fileSha;

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                if (putRes.ok) {
                    alert('🎉 完美成功！数据已纯净重建并存入云端。\n此文件已永久绑定路径：' + filePath);
                    if (controls.style.display === 'block') toggleEditMode(); 
                } else {
                    const err = await putRes.json();
                    throw new Error(err.message || '保存失败');
                }
            } catch (e) { 
                alert('网络或 Token 错误: ' + e.message); 
                controls.style.display = 'block'; 
            }
            finally { 
                saveBtn.innerText = '🚀 同步提交到 GitHub'; 
                saveBtn.style.pointerEvents = 'auto'; 
            }
        });
    </script>
</body>
</html>
